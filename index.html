<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ネオ電気街 デモ</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- 3D表示用（three.js はこのフォルダの vendor にある。3Dを選ぶまで読み込まれない） -->
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js"}}</script>
  <script defer src="js/filters.js"></script>
  <script defer src="js/panzoom.js"></script>
  <script defer src="js/view-top.js"></script>
  <script defer src="js/view-oblique.js"></script>
  <script defer src="js/view-3d.js"></script>
  <script defer src="js/home.js"></script>
  <script defer src="js/shops.js"></script>
  <script defer src="js/tours.js"></script>
  <script defer src="js/arrange.js"></script>
  <script defer src="js/booking.js"></script>
  <script defer src="js/admin.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <!-- 常時表示のデモ表示 -->
  <div class="demo-strip" role="note">これは架空のデモです。実在の店舗・商品とは関係ありません。</div>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="#/">ネオ電気街</a>
      <button type="button" class="hamburger" data-menu-btn aria-label="メニュー" aria-expanded="false" aria-controls="drawer">
        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
      </button>
    </div>
  </header>

  <!-- メニュー（右からスライド） -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <nav class="drawer" id="drawer" aria-label="メインメニュー" aria-hidden="true">
    <div class="drawer-head">
      <span class="drawer-title">メニュー</span>
      <button type="button" class="drawer-close" id="drawer-close" aria-label="閉じる"><span aria-hidden="true">×</span> 閉じる</button>
    </div>
    <ul class="drawer-list">
      <li><a href="#/" data-route="top">マップ</a></li>
      <li><a href="#/shops" data-route="shops">お店・キャンペーン</a></li>
      <li><a href="#/shops?f=live" data-route="campaigns">キャンペーン</a></li>
      <li><a href="#/tours" data-route="tours">ツアー</a></li>
      <li><a href="#/arrange" data-route="arrange">AIアレンジ</a></li>
      <li><a href="#/booking" data-route="booking">ツアー受付</a></li>
    </ul>
  </nav>

  <main id="app" class="wrap" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="wrap">
      <small>© ネオ電気街 デモ（架空）</small>    </div>
  </footer>

  <!-- 運営用ログインの入口（デモ専用・目立たない小さなボタン） -->
  <button type="button" class="admin-entry" id="admin-entry">管理（デモ版専用）</button>
  <dialog class="login-dialog card" id="login-dialog" aria-labelledby="login-title">
    <form id="admin-login" method="dialog" novalidate>
      <h2 id="login-title">管理画面ログイン</h2>
      <p class="muted small">デモ版専用です。</p>
      <div class="field"><label for="login-id">ID</label>
        <input class="input" type="text" id="login-id" autocomplete="username"></div>
      <div class="field"><label for="login-pw">パスワード</label>
        <input class="input" type="password" id="login-pw" autocomplete="current-password"></div>
      <p class="field-error" id="login-error" role="alert"></p>
      <div class="btn-row">
        <button type="submit" class="btn btn-primary">ログイン</button>
        <button type="button" class="btn btn-ghost" id="login-cancel">キャンセル</button>
      </div>
    </form>
  </dialog>
</body>
</html>
